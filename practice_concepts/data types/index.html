// a queue is a data structure that follows the First In First Out (FIFO) principle, where the first element added to the queue is the first one to be removed.
// a stack is a data structure that follows the Last In First Out (LIFO) principle, where the last element added to the stack is the first one to be removed.
// Array can be used to implement both queues and stacks in JavaScript.

let queue = [];
queue.push(1); // add an element to the end of the queue
queue.push(2);
queue.push(3);
console.log(queue); // Output: [1, 2, 3]
queue.shift(); // remove the first element from the queue
console.log(queue); // Output: [2, 3]
queue.unshift(0); // add an element to the beginning of the queue
console.log(queue); // Output: [0, 2, 3]
queue.pop(); // remove the last element from the queue

function sumInput() {
  let numbers = [];

  while (true) {
    let value = prompt("Enter a number:", 0);

    if (value === "" || value === null || !isFinite(value)) break;

    numbers.push(+value);
  }

  let sum = 0;
  for (let number of numbers) {
    sum += number;
  }
  return sum;
}

// 4. example of array methods:

function getMaxSubSum(arr) {
  let maxSum = 0; // if we take no elements, zero will be returned

  for (let i = 0; i < arr.length; i++) {
    let sumFixedStart = 0;
    for (let j = i; j < arr.length; j++) {
      sumFixedStart += arr[j];
      maxSum = Math.max(maxSum, sumFixedStart);
    }
  }

  return maxSum;
}
