<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion</title>
</head>
<body>
    <h1>operators</h1>
    <p>check the console</p>
    <script>
       // --- 1. Arithmetic Operators ---
       let a = 10, b = 3;
       console.log("Addition (a + b):", a + b); // 13
       console.log("Subtraction (a - b):", a - b); // 7
       console.log("Multiplication (a * b):", a * b); // 30
       console.log("Division (a / b):", a / b); // 3.3333333333333335
       console.log("Modulus/Remainder (a % b):", a % b); // 1
       console.log("Exponentiation (a ** b):", a ** b); // 1000
       a++; console.log("Increment (a++):", a); // 11
       b--; console.log("Decrement (b--):", b); // 2

       // --- 2. Assignment Operators ---
       let x = 10;
       x += 5; // This is equivalent to writing: x = x + 5
       console.log("Assignment (x += 5):", x); // 15

       // --- 3. Comparison Operators ---
       console.log("Loose Equal to (5 == '5'):", 5 == '5'); // true (checks value only)
       console.log("Strict Equal to (5 === '5'):", 5 === '5'); // false (checks value AND type)
       console.log("Not Equal (5 != 4):", 5 != 4); // true
       console.log("Greater than (5 > 3):", 5 > 3); // true

       // --- 4. Logical Operators ---
       let isAdult = true, hasID = false;
       console.log("Logical AND (isAdult && hasID):", isAdult && hasID); // false (both must be true)
       console.log("Logical OR (isAdult || hasID):", isAdult || hasID); // true (at least one must be true)
       console.log("Logical NOT (!isAdult):", !isAdult); // false (flips the boolean value)

       // --- 5. String Operators ---
       let greeting = "Hello" + " " + "World!";
       console.log("String Concatenation:", greeting); // "Hello World!"

       // --- 6. Ternary Operator ---
       let age = 20;
       let access = (age >= 18) ? "Granted" : "Denied";
       console.log("Ternary Operator check:", access); // "Granted"

       // --- 7. User Input using prompt and alert ---
       // Prompt asks the user for input. If they click Cancel, it returns null.
       let userName = prompt("Please enter your name:");
       
       // We use a ternary operator to handle the case where they leave it blank or click cancel
       let displayName = userName ? userName : "Guest";
       
       // Alert displays the popup box back to the user
       alert("Welcome, " + displayName + "! Please check your developer console to see the operator math examples.");



</script>
</body>
</html>
