//============================================ optional chaining operator ?. =========================================//

//optional chaining operator ?. allows us to access the properties of an object without having to check if the object is null or undefined.
// It returns undefined if the object is null or undefined, instead of throwing an error. 
// This can be useful when working with nested objects or when we are not sure if an object exists.
// It is a safe way to access the properties of an object without having to check if the object is null or undefined.

let user = {};

console.log(user?.address?.street); // Output: undefined, because user object does not have an address property, so it returns undefined instead of throwing an error

let user1 = null;

console.log(user1?.address?.street); // Output: undefined, because user1 is null, so it returns undefined instead of throwing an error
    
//it only  protectes the left side of the operator, if the left side is null or undefined, it returns undefined, otherwise it returns the value of the right side of the operator.

//short circuiting with optional chaining operator ?.

let user2 = null;
let x = 0;

console.log(user2?.name || x++); // Output: undefined, because user2 is null, so it returns undefined instead of throwing an error, and x is not incremented because the left side of the operator is null or undefined

//============================================ symbols =========================================//

//symbols are a new primitive type in JavaScript that was introduced in ES6. 
// They are unique and immutable values that can be used as keys for object properties. Symbols are created using the Symbol() function, and they can be used to create private properties or to avoid naming collisions in objects.
// The main advantage of using symbols is that they are guaranteed to be unique, even if two symbols have the same description. This makes them useful for creating private properties or for creating keys that won't conflict with other keys in an object.

let id = Symbol("id");

let user = {
   name: "John",
   [id]: 123
};

console.log(user.name); // John
console.log(user[id]);  // 123, use [] to access the symbol property of the user object

//global symbols:

let globalId = Symbol.for("globalId");
let user1 = {
    name: "John",
    [globalId]: 123
};
let user2 = {
    name: "Jane",
    [globalId]: 456
};

console.log(user1[globalId]); // Output: 123
console.log(user2[globalId]); // Output: 456


//with global symbol Symbol.for() same key ke liye same symbol return karta hai.

let id1 = Symbol.for("id");
let id2 = Symbol.for("id");

console.log(id1 === id2);// Output: true, because both id1 and id2 are created using Symbol.for() with the same key "id", so they refer to the same symbol in the global symbol registry.

//use Symbol.keyFor() method to get the key of a global symbol:
console.log(Symbol.keyFor(Symbol.for("id"))); // Output: id, because Symbol.for() creates a global symbol with the key "id", and Symbol.keyFor() returns the key of the global symbol

//but we can not do the same for normal symbols, because normal symbols are unique and do not have a global registry.

let id3 = Symbol("id");
let id4 = Symbol("id");

console.log(id3 === id4);// Output: false, because both id3 and id4 are created using Symbol() with the same description "id", but they are unique symbols and do not refer to the same symbol in the global symbol registry.
