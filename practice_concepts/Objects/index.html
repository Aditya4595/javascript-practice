<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects</title>
</head>
<body>
    <h1>Objects</h1>
    <script>
        // Objects are a collection of key-value pairs
        // They are used to store data in a structured way

        // Creating an object
       /* const person = {
            name: "John",
            age: 30,
            city: "New York"
        };

        // Accessing object properties
        console.log(person.name); // Output: John
        console.log(person.age); // Output: 30
        console.log(person.city); // Output: New York

        // Adding a new property to the object
        person.job = "Developer";
        console.log(person.job); // Output: Developer

        // Modifying an existing property
        person.age = 31;
        console.log(person.age); // Output: 31

        // Deleting a property from the object
        delete person.city;
        console.log(person.city); // Output: undefined

        const personalInfo = {
            name: "aditya bhanushali",
            age: 21,
            city: "mumbai",
            job: "developer",
            company: "google",
            "is this a student": true//use " " to define a key with spaces in it
        };
        console.log(personalInfo.name); // Output: aditya bhanushali
        console.log(personalInfo.age); // Output: 21
        console.log(personalInfo.city); // Output: mumbai
        console.log(personalInfo.job); // Output: developer
        console.log(personalInfo.company); // Output: google
        console.log(personalInfo["is this a student"]); // Output: true
        personalInfo.cgpa = 9.5; //adding a new property to the object
        console.log(personalInfo.cgpa); // Output: 9.5

        personalInfo["favorite color"] = "blue"; //adding a new property with a key that has spaces in it
        console.log(personalInfo["favorite color"]); // Output: blue

           
        console.log(personalInfo[ "is this a student"]);

        let fruit = "apple";// variable to hold the key name

        let bag ={
            [fruit]: 5 //accessing the property of fruit with [ ] which is apple and assigning it a value of 5
        };
        console.log(bag.apple); // Output: 5

        let name = "aditya";
        let age = 21;

        let user = {
            name, //shorthand property name, equivalent to name: name
            age ,//shorthand property name, equivalent to age: age
            salary: 30000 //initially setting salary property to undefined or assign the value of 30000 to salary property of user object

        };
        console.log(user.name); // Output: aditya
        console.log(user.age); // Output: 21

        user.salary === undefined ? user.salary = 50000 : user.salary; //checking if salary property exists in user object, if not then assigning it a value of 50000
        console.log(user.salary); // Output: 50000

        console.log("date of birth" in user); // Output: false, checking if "date of birth" property exists in user object      
        //in operator is used to check if a property exists in an object, it returns true if the property exists and false if it does not exist

        
        //for...in loop is used to iterate over the properties of an object, it returns the keys of the object which can be used to access the values of the object

        for (let key in user) {
            console.log(key + ": " + user[key]); // Output: name: aditya, age: 21, salary: 50000
        }

        delete user.age; //deleting the age property from user object
        console.log(user.age); // Output: undefined, age property has been deleted from user object */    
    </script>
</body>
</html>
