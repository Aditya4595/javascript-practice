        //copying with const keyword

        const student = {
            name: "Aditya Bhanushali",
            age: 21,
            city: "Mumbai"
            };

            student.name = "gobra";//modifying the name property of student object, which is allowed because const only protects the reference of the object student, we can still modify the properties of the object student, but we cannot reassign the student variable to a new object or value.

        }

        //cloning an object

        //method 1: using for...in loop to copy the properties of an object to a new object

            let user = {name:"john",age :20};

            let clone = {}; //creating an empty object to hold the cloned properties of user object

            for (let key in user){
                clone[key] = user[key]; //copying the properties of user object to clone object
            }
        console.log(clone); // Output: {name: "john", age: 20}

        //method 2: using Object.assign() method to copy the properties of an object to a new object

        let user = {name:"john",age :20};

        let clone = Object.assign({}, user); //creating a new object and copying the properties of user object to it using Object.assign() method
       
        console.log(clone); // Output: {name: "john", age: 20}

        //method 3: using spread operator to copy the properties of an object to a new object

        let user = {name:"john",age :20};
        let clone = {...user}; //creating a new object and copying the properties of user object to it using spread operator
        console.log(clone); // Output: {name: "john", age: 20}

        //Merging objects

        let user = {name:"john",age :20};
        let admin = {admin:true};  

        let merged = Object.assign({}, user, admin); //creating a new object and merging the properties of user and admin objects to it using Object.assign() method
        console.log(merged); // Output: {name: "john", age: 20, admin: true}
        
        let merged2 = {...user, ...admin}; //creating a new object and merging the properties of user and admin objects to it using spread operator
        console.log(merged2);

        let user = {

        };

        };

        console.log(classroom); // Output : {name: "John", age: 30, city: "New York", role: "admin"}

        //shallow and deep cloning of objects

        let user = {
            name : "John",
            age : 30,

            sizes :{
                height : 180,
                width : 50
            }
        };
        
        let clone = Object.assign({}, user); //shallow cloning

        console.log(user.sizes === clone.sizes); // Output: true, because both user and clone are referencing the same sizes object in memory
        
        user.sizes.height = 190; //modifying the height property of sizes object in user object, which also modifies the height property of sizes object in clone object because both user and clone are referencing the same sizes object in memory
        console.log(clone.sizes.height); // Output: 190, because both user and clone are referencing the same sizes object in memory
        
        //this is called shallow copying because only the first level of properties are copied, and the nested objects are still referencing the same object in memory.it copied only name,age,sizes properties of user object to clone object, but it only has the reference of the sizes object, not the actual sizes object itself.

        //deep cloning of objects
